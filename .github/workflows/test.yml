name: Run Tests

# Manual test execution only - automatic tests are handled by:
# - pr-gate.yml (on pull requests to main)
# - docker-build.yml (image build on push to main or tags v*)
on:
  pull_request:
    branches:
      - main
    types: [labeled]  # Only when 'run-tests' label is added
  workflow_dispatch:  # Manual trigger from Actions UI

jobs:
  test:
    name: Run Rails tests (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Run only if:
    # - Manual trigger (workflow_dispatch)
    # - PR labeled with "run-tests"
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-tests'))

    steps:
      - uses: actions/checkout@v4

      - name: Build e2e stack
        run: docker compose -f docker-compose.e2e.yml build

      - name: Run unit and controller tests
        run: docker compose -f docker-compose.e2e.yml run --rm bibliogo sh -c "rake db:mongoid:create_indexes && rails test"

      - name: Run system (e2e) tests
        run: docker compose -f docker-compose.e2e.yml run --rm bibliogo sh -c "rails test:system"

  cleanup:
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-tests')
    permissions:
      pull-requests: write

    steps:
      - name: Remove run-tests label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'run-tests'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
