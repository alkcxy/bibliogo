name: PR Merge Gate

# Runs the full test suite on every PR to main.
# Require this check in branch protection to gate merges on green tests.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

jobs:
  test:
    name: Run Rails tests (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Build e2e stack
        run: docker compose -f docker-compose.e2e.yml build

      - name: Run unit and controller tests
        run: docker compose -f docker-compose.e2e.yml run --rm bibliogo sh -c "rake db:mongoid:create_indexes && rails test"

      - name: Run system (e2e) tests
        run: docker compose -f docker-compose.e2e.yml run --rm bibliogo sh -c "rails test:system"
